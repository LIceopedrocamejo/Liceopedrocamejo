<!-- Configuración PWA e Iconos --> 
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liceo Pedro Camejo">

<script>
  // Generar Manifest.json dinámicamente mediante Data URI
  const manifestData = {
    "name": "Control Escolar - Liceo Pedro Camejo",
    "short_name": "Liceo Camejo",
    "description": "Sistema Integrado de Control Escolar y Gestión Administrativa",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#4f46e5",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3135/3135755.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3135/3135755.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = manifestURL;
  document.head.appendChild(manifestLink);

  // Registro del Service Worker para funcionamiento Offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swCode = `
        const CACHE_NAME = 'liceo-camejo-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => {
              return cache.addAll(['./']);
            })
          );
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((response) => {
              return response || fetch(e.request);
            })
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swURL = URL.createObjectURL(swBlob);

      //navigator.serviceWorker.register(swURL)
        .then(() => console.log('Service Worker PWA Registrado'))
        .catch((err) => console.log('Error SW:', err));
    });
  }
</script>
